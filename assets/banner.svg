<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Card/Pill Background -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glowing Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="12"/>
  <rect width="1200" height="300" fill="url(#grid)" rx="12"/>

  <!-- Dynamic / Animated Ambient Elements (Background decoration) -->
  <g opacity="0.4">
    <!-- Pulsing Orbs in background -->
    <circle cx="150" cy="80" r="120" fill="#38bdf8" filter="blur(60px)">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="100;130;100" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="220" r="140" fill="#c084fc" filter="blur(70px)">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Dynamic Security Radar Line (Background right) -->
  <g transform="translate(950, 150)" opacity="0.25">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#818cf8" stroke-width="1"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#c084fc" stroke-width="1"/>
    <line x1="0" y1="0" x2="90" y2="-45" stroke="#38bdf8" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Flowing Container Scanning Pulse Nodes (Background Bottom) -->
  <g fill="none" stroke="url(#accent-grad)" stroke-width="2" opacity="0.3">
    <path d="M 100 240 Q 300 280 600 240 T 1100 250">
      <animate attributeName="stroke-dashoffset" values="1000;0" dur="15s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Foreground Content Container (guaranteed non-overlapping text) -->
  <g transform="translate(60, 0)">
    <!-- Category Badge Pill -->
    <rect x="0" y="45" width="280" height="32" rx="16" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="18" cy="61" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="66" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">CONTAINER SECURITY 2026</text>

    <!-- Main Title (Crisp, High Visibility Foreground) -->
    <text x="0" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Container Security Scanning
    </text>

    <!-- Subtitle -->
    <text x="0" y="165" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
      Curated Ecosystem of SaaS Platforms, Open-Source Scanners, SBOM Tools &amp; Runtime Security
    </text>

    <!-- Highlight Feature Badges / Metadata Chips -->
    <g transform="translate(0, 195)">
      <!-- Chip 1: Vulnerability Scanners -->
      <rect x="0" y="0" width="180" height="36" rx="8" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="16" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🛡️ Image Scanning</text>

      <!-- Chip 2: SBOM Generation -->
      <rect x="192" y="0" width="165" height="36" rx="8" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="208" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">📦 SBOM Analysis</text>

      <!-- Chip 3: Runtime Security -->
      <rect x="369" y="0" width="180" height="36" rx="8" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="385" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⚡ Runtime Protection</text>

      <!-- Chip 4: Open Source -->
      <rect x="561" y="0" width="170" height="36" rx="8" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="577" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⭐ Open-Source &amp; SaaS</text>
    </g>
  </g>
</svg>
